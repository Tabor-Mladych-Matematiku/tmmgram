{# templates/index.html #}

{% extends "base.html" %}

{% block content %}
    <div id="posts"
         data-limit="{{ post_feed_limit|default(10) }}"
         data-posts-url="{{ url_for('feed.render_posts') }}">
        {% include "posts.html" %}
    </div>
    <p id="posts-status" class="text-center text-muted my-3" style="display:none;"></p>
    <div id="posts-sentinel"></div>
{% endblock content %}

{% block script %}
    {{ super() }}
    <script src="{{ url_for('static', filename='feed.js') }}" defer></script>
{% endblock script %}
